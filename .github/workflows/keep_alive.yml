name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping ServiceWise API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging ServiceWise backend..."
          STATUS_CODE=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" https://servicewise-api.onrender.com/health)
          echo "HTTP Status: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Backend is healthy!"
          else
            echo "Backend health check failed!"
            exit 1
          fi
